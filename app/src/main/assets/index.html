<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقات الألمانية</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#1f6f5c;--acx:#fff;--bd:#dedcd4;--rd:#c0392b;--or:#d98324;--gn:#2e8b57;--bl:#2f6fb5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--sf:#22221f;--tx:#efeee9;--mu:#a09e96;--ac:#4fb59c;--acx:#0f1f1b;--bd:#37362f}}
:root[data-theme="dark"]{--bg:#161615;--sf:#22221f;--tx:#efeee9;--mu:#a09e96;--ac:#4fb59c;--acx:#0f1f1b;--bd:#37362f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:28px 18px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.de{font-size:34px;font-weight:700;direction:ltr}
.ar{font-size:26px}
.ex{font-size:17px;color:var(--mu);direction:ltr}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin-bottom:8px}
button.sp{border:none;background:var(--ac);color:var(--acx);width:56px;height:56px;border-radius:50%;font-size:24px;cursor:pointer}
button.main{width:100%;margin-top:12px;padding:14px;border:none;border-radius:12px;background:var(--ac);color:var(--acx);font-size:17px;cursor:pointer}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.rate button{padding:12px 2px;border:none;border-radius:10px;color:#fff;font-size:14px;cursor:pointer}
.rate small{display:block;opacity:.85;font-size:11px}
input,textarea,select{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font-size:16px;font-family:inherit}
h3{margin:18px 0 6px;font-size:17px}
.row{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.row .t{flex:1;min-width:0}.row b{direction:ltr;display:inline-block}
.row button{border:none;background:none;font-size:18px;cursor:pointer;color:var(--tx)}
.hint{color:var(--mu);font-size:14px}
.warn{background:#fff3cd;color:#664d03;padding:8px 12px;border-radius:8px;font-size:14px;margin-bottom:10px}
.hide{display:none}
</style>
</head>
<body>
<main>
<nav>
<button id="t1" class="on">مراجعة</button>
<button id="t2">البطاقات</button>
<button id="t3">إعدادات</button>
</nav>
<div id="warn" class="warn hide">لم يُعثر على صوت ألماني في جهازك. ثبّت صوت German من إعدادات النظام (تحويل النص إلى كلام).</div>

<section id="p1">
<div class="meta"><span id="cnt"></span><span id="tot"></span></div>
<div id="stage"></div>
</section>

<section id="p2" class="hide">
<h3>بطاقة جديدة</h3>
<input id="nde" lang="de" dir="ltr" placeholder="Wort, z. B. die Begleitung">
<input id="nar" placeholder="المعنى بالعربية">
<input id="nex" lang="de" dir="ltr" placeholder="Beispielsatz (اختياري)">
<button class="main" id="add">إضافة</button>
<h3>استيراد من ملف CSV</h3>
<p class="hint">كل سطر: ألماني;عربي;مثال. افصل بفاصلة منقوطة أو فاصلة أو Tab.</p>
<textarea id="csv" rows="4" dir="ltr" placeholder="der Termin;الموعد;Ich habe morgen einen Termin."></textarea>
<button class="main" id="imp">استيراد</button>
<h3>كل البطاقات (<span id="n"></span>)</h3>
<div id="list"></div>
</section>

<section id="p3" class="hide">
<h3>الصوت</h3>
<label class="hint">الصوت الألماني</label>
<select id="voice"></select>
<label class="hint">سرعة النطق: <span id="rv"></span></label>
<input type="range" id="rate" min="0.5" max="1.2" step="0.05">
<label class="hint"><input type="checkbox" id="auto" style="width:auto;margin:0 0 0 6px"> نطق تلقائي عند ظهور الكلمة</label>
<button class="main" id="test">تجربة الصوت</button>
<h3>البيانات</h3>
<button class="main" id="reset" style="background:var(--rd)">حذف كل البطاقات وإعادة البداية</button>
</section>
</main>

<script>
const DAY=86400000;
const SEED=[["der Termin","الموعد","Ich habe morgen einen Termin beim Arzt."],["die Begleitung","المرافقة","Die Begleitung im Unterricht ist wichtig."],["die Bewerbung","طلب التوظيف","Ich schreibe heute meine Bewerbung."],["der Ausbildungsplatz","مقعد التدريب المهني","Ich suche einen Ausbildungsplatz in Stuttgart."],["die Erfahrung","الخبرة","Ich habe Erfahrung im Lager."],["zuverlässig","موثوق","Er ist ein zuverlässiger Mitarbeiter."],["die Unterstützung","الدعم","Das Kind braucht Unterstützung im Alltag."],["sich vorstellen","يقدّم نفسه","Ich möchte mich kurz vorstellen."],["die Zusammenarbeit","التعاون","Die Zusammenarbeit mit dem Team klappt gut."],["der Lebenslauf","السيرة الذاتية","Bitte schicken Sie Ihren Lebenslauf."]];
let S={cards:[],rate:0.85,auto:true,voice:""};
let cur=null,shown=false,voices=[];
const $=id=>document.getElementById(id);
function load(){try{const r=localStorage.getItem("dk1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.cards.length)S.cards=SEED.map(mk)}
function save(){try{localStorage.setItem("dk1",JSON.stringify(S))}catch(e){}}
function mk(a){return{id:Date.now()+Math.random(),de:a[0],ar:a[1],ex:a[2]||"",due:0,int:0,ease:2.5,reps:0}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function loadVoices(){voices=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>v.lang.toLowerCase().startsWith("de"));
const sel=$("voice");sel.innerHTML=voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("");
if(S.voice)sel.value=S.voice;
$("warn").classList.toggle("hide",voices.length>0)}
function speak(t){if(!window.speechSynthesis||!t)return;speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=S.rate;
const v=voices.find(v=>v.name===S.voice)||voices[0];if(v)u.voice=v;speechSynthesis.speak(u)}

function queue(){const n=Date.now();return S.cards.filter(c=>c.due<=n).sort((a,b)=>a.due-b.due)}
function fmt(d){if(d<1/1440*1.5)return"دقيقة";if(d<1)return Math.round(d*1440)+" د";if(d<30)return Math.round(d)+" ي";return Math.round(d/30)+" ش"}
function nextInt(c,q){const r=c.reps;
if(q===0)return 1/1440;
if(q===1)return Math.max(1,(c.int||1)*1.2);
if(q===2)return r===0?1:r===1?3:Math.max(1,c.int*c.ease);
return r===0?4:Math.max(4,(c.int||1)*c.ease*1.3)}

function render(){const q=queue();$("cnt").textContent="للمراجعة الآن: "+q.length;$("tot").textContent="المجموع: "+S.cards.length;
const st=$("stage");
if(!q.length){cur=null;const nx=S.cards.map(c=>c.due).sort((a,b)=>a-b)[0];
const w=nx?Math.max(1,Math.ceil((nx-Date.now())/60000)):0;
st.innerHTML=`<div class="card"><div class="ar">أحسنت! لا توجد بطاقات الآن</div><div class="hint">${w?"البطاقة التالية بعد حوالي "+(w<90?w+" دقيقة":Math.round(w/60)+" ساعة"):"أضف بطاقات من تبويب البطاقات"}</div></div>`;return}
if(!cur||!q.includes(cur)){cur=q[0];shown=false}
const c=cur;
st.innerHTML=`<div class="card"><div class="de" lang="de">${esc(c.de)}</div>
<button class="sp" id="spk" aria-label="نطق">🔊</button>
${shown?`<div class="ar">${esc(c.ar)}</div>${c.ex?`<div class="ex" lang="de">${esc(c.ex)}</div><button class="sp" id="spx" style="width:40px;height:40px;font-size:17px" aria-label="نطق الجملة">🔊</button>`:""}`:""}</div>
${shown?`<div class="rate">
<button style="background:var(--rd)" data-q="0">نسيت<small>${fmt(nextInt(c,0))}</small></button>
<button style="background:var(--or)" data-q="1">صعب<small>${fmt(nextInt(c,1))}</small></button>
<button style="background:var(--gn)" data-q="2">جيد<small>${fmt(nextInt(c,2))}</small></button>
<button style="background:var(--bl)" data-q="3">سهل<small>${fmt(nextInt(c,3))}</small></button></div>`:`<button class="main" id="show">إظهار المعنى</button>`}`;
$("spk").onclick=()=>speak(c.de);
if($("spx"))$("spx").onclick=()=>speak(c.ex);
if($("show"))$("show").onclick=()=>{shown=true;render();speak(c.de)};
st.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>rate(+b.dataset.q));
}
function rate(q){const c=cur;const d=nextInt(c,q);
if(q===0){c.ease=Math.max(1.3,c.ease-0.2);c.reps=0}else{if(q===1)c.ease=Math.max(1.3,c.ease-0.15);if(q===3)c.ease+=0.1;c.reps++}
c.int=q===0?0:d;c.due=Date.now()+d*DAY;save();cur=null;shown=false;render();
if(cur&&S.auto)speak(cur.de)}

function renderList(){$("n").textContent=S.cards.length;
$("list").innerHTML=S.cards.map(c=>`<div class="row"><button data-s="${c.id}" aria-label="نطق">🔊</button><div class="t"><b lang="de">${esc(c.de)}</b> · ${esc(c.ar)}</div><button data-d="${c.id}" aria-label="حذف">🗑️</button></div>`).join("");
$("list").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>speak(S.cards.find(c=>c.id==b.dataset.s).de));
$("list").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.cards=S.cards.filter(c=>c.id!=b.dataset.d);save();renderList()})}

function tab(i){["1","2","3"].forEach(k=>{$("p"+k).classList.toggle("hide",k!=i);$("t"+k).classList.toggle("on",k==i)});
if(i==1){render();if(cur&&S.auto)speak(cur.de)}if(i==2)renderList()}
["1","2","3"].forEach(k=>$("t"+k).onclick=()=>tab(k));

$("add").onclick=()=>{const d=$("nde").value.trim(),a=$("nar").value.trim();if(!d||!a)return;
S.cards.unshift(mk([d,a,$("nex").value.trim()]));save();["nde","nar","nex"].forEach(k=>$(k).value="");renderList()};
$("imp").onclick=()=>{const rows=$("csv").value.split("\n").map(l=>l.split(/[;\t,]/).map(s=>s.trim())).filter(r=>r[0]&&r[1]);
rows.forEach(r=>S.cards.unshift(mk(r)));save();$("csv").value="";renderList()};
$("voice").onchange=e=>{S.voice=e.target.value;save()};
$("rate").oninput=e=>{S.rate=+e.target.value;$("rv").textContent=S.rate;save()};
$("auto").onchange=e=>{S.auto=e.target.checked;save()};
$("test").onclick=()=>speak("Guten Tag, ich möchte mich kurz vorstellen.");
$("reset").onclick=()=>{if(confirm("هل أنت متأكد؟")){S.cards=SEED.map(mk);save();renderList();cur=null}};

load();$("rate").value=S.rate;$("rv").textContent=S.rate;$("auto").checked=S.auto;
loadVoices();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=loadVoices;
render();
</script>
</body>
</html>
