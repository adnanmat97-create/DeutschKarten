name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Node.js for FSRS bundle
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle official FSRS scheduler
        run: |
          npm init -y
          npm install --no-save ts-fsrs@5.4.2 esbuild@0.25.0
          npx esbuild fsrs-entry.js --bundle --platform=browser --format=iife --outfile=app/src/main/assets/fsrs-engine.js
          python3 - <<'PY'
          import re
          html = open("app/src/main/assets/index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          open("/tmp/deutschkarten-inline.js", "w", encoding="utf-8").write(scripts[-1])
          PY
          node --check /tmp/deutschkarten-inline.js
          node --check ai-worker/index.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-Karten-APK
          path: app/build/outputs/apk/debug/app-debug.apk
